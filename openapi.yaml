openapi: 3.1.0
info: { title: Social Intelligence API, version: 1.0.0 }
servers: [{ url: /api/v1 }]
paths:
  /projects:
    get: { summary: List portfolio products, responses: { '200': { description: OK } } }
  /projects/{slug}:
    get: { summary: Read a governed product view, parameters: [{ name: slug, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK }, '404': { description: Missing } } }
  /projects/{slug}/workspace:
    get: { summary: Read the product-specific decision workflow, responses: { '200': { description: OK } } }
  /actions:
    post: { summary: Write an auditable analyst action, requestBody: { required: true }, responses: { '201': { description: Created }, '422': { description: Validation error } } }
  /reports:
    post: { summary: Queue a governed executive brief, responses: { '202': { description: Queued } } }
